<svg viewBox="0 0 680 262" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="262" fill="#ffffff"/>
  <text x="24" y="24" font-size="15" font-weight="700" fill="#111827">核心症结：渲染机重的不是"渲染"，是它多背了一个 base</text>

  <rect x="30" y="44" width="270" height="132" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="44" y="65" font-size="12" font-weight="600" fill="#334155">直觉：渲染机只负责渲染</text>
  <rect x="44" y="78" width="242" height="30" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="165" y="97" font-size="11" fill="#475569" text-anchor="middle">ffmpeg · Chrome</text>
  <text x="44" y="134" font-size="11.5" fill="#059669">→ 环境轻，加机器很便宜</text>
  <text x="44" y="156" font-size="10.5" fill="#94a3b8">（这是部署时理所当然的假设）</text>

  <text x="312" y="114" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle">+</text>
  <text x="340" y="114" font-size="10" fill="#dc2626">被一起派发</text>

  <rect x="380" y="44" width="270" height="132" rx="9" fill="#fffbfb" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="394" y="65" font-size="12" font-weight="600" fill="#991b1b">实际：worker.mjs</text>
  <rect x="394" y="78" width="242" height="30" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="515" y="97" font-size="11" fill="#475569" text-anchor="middle">ffmpeg · Chrome（渲染）</text>
  <rect x="394" y="112" width="242" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="515" y="131" font-size="11" fill="#b91c1c" text-anchor="middle">base：whisper 模型 + API 密钥</text>
  <text x="394" y="160" font-size="11.5" fill="#dc2626">→ 环境重，N 台就是 N 套</text>

  <rect x="24" y="188" width="630" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="38" y="207" font-size="11.5" fill="#0f172a"><tspan font-weight="700">关键环节一</tspan>　分派看「阶段」不看「能力」——base 是入口，于是每个任务都默认落到渲染机</text>
  <text x="38" y="231" font-size="11.5" fill="#0f172a"><tspan font-weight="700">关键环节二</tspan>　base 的产物 proxy.mp4 只认本机路径 —— base 在哪台跑，整套 AI 环境就得在哪台</text>
